<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="124" viewBox="0 0 1328 124" role="img" aria-labelledby="title desc">
  <title id="title">KIM MINSEOK — Terminal profile footer</title>
  <desc id="desc">Terminal-style GitHub profile footer tightly cropped to the terminal frame.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020806"/>
      <stop offset="100%" stop-color="#071A15"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#071812"/>
      <stop offset="50%" stop-color="#0A2119"/>
      <stop offset="100%" stop-color="#071812"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="45%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity=".16"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="window">
      <rect x=".5" y=".5" width="1327" height="123" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect width="1328" height="124" fill="url(#bg)"/>
    <rect width="1328" height="124" fill="url(#scanlines)"/>
    <rect width="1328" height="124" fill="#010403" fill-opacity=".90"/>
    <rect width="1328" height="34" fill="url(#bar)"/>

    <circle cx="22" cy="17" r="5" fill="#EF4444"/>
    <circle cx="40" cy="17" r="5" fill="#F59E0B"/>
    <circle cx="58" cy="17" r="5" fill="#22C55E"/>

    <text x="664" y="22"
          text-anchor="middle"
          fill="#5EEAD4"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="11">minseok@enterprise: ~/profile</text>

    <text x="32" y="64"
          fill="#4ADE80"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="13"
          font-weight="700">$ exit</text>

    <text x="32" y="92"
          fill="#E5FFF4"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="14"
          font-weight="650">Architecture matters. Domain context matters. Evidence matters.</text>

    <text x="32" y="114"
          fill="#86EFAC"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="11">Process completed successfully · exit_code=0 · connection closed</text>

    <rect x="756" y="108" width="500" height="2" rx="1"
          fill="url(#accent)" filter="url(#softGlow)"/>
  </g>

  <rect x=".5" y=".5" width="1327" height="123" rx="12"
        fill="none" stroke="#34D399" stroke-opacity=".42" stroke-width="1"/>
</svg>
