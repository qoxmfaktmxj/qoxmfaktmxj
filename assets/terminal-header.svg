<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Ops</title>
  <desc id="desc">GitHub profile banner concept for Kim Minseok.</desc>
  <defs>

    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020806"/>
      <stop offset="100%" stop-color="#071A15"/>
    </linearGradient>
    <pattern id="t-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity=".18"/>
    </pattern>
    <filter id="t-glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  </defs>
  <rect width="1440" height="320" fill="#020806"/>

  <rect width="1440" height="320" fill="url(#t-bg)"/>
  <rect width="1440" height="320" fill="url(#t-scan)"/>
  <rect x="56" y="34" width="1328" height="252" rx="12" fill="#010403" stroke="#34D399" stroke-opacity=".35"/>
  <rect x="56" y="34" width="1328" height="34" rx="12" fill="#0A1914"/>
  <circle cx="78" cy="51" r="5" fill="#EF4444"/>
  <circle cx="96" cy="51" r="5" fill="#F59E0B"/>
  <circle cx="114" cy="51" r="5" fill="#22C55E"/>
  <text x="720" y="56" text-anchor="middle" fill="#5EEAD4" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">minseok@enterprise: ~/profile</text>

  <text x="88" y="112" fill="#4ADE80" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700">$ whoami</text>
  <text x="88" y="174" fill="#E5FFF4" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="54" font-weight="800" filter="url(#t-glow)">&gt; KIM_MINSEOK</text>
  <text x="88" y="214" fill="#67E8F9" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">HR_DOMAIN :: BACKEND :: AI_SYSTEMS</text>
  <text x="88" y="251" fill="#86EFAC" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12">status=building_reliable_systems  evidence=true  guardrails=enabled</text>

  <g transform="translate(980 95)" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12">
    <text x="0" y="0" fill="#64748B">[runtime]</text>
    <text x="0" y="29" fill="#A7F3D0">java/spring</text>
    <text x="0" y="53" fill="#A7F3D0">oracle/postgres</text>
    <text x="0" y="77" fill="#A7F3D0">python/fastapi</text>
    <text x="0" y="101" fill="#67E8F9">skills/agents/hooks</text>
    <text x="0" y="125" fill="#67E8F9">rag/wiki/graph</text>
    <rect x="0" y="145" width="228" height="2" fill="#34D399"/>
    <text x="0" y="170" fill="#FFFFFF">exit_code: 0</text>
  </g>

</svg>
