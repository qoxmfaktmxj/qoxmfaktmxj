<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="160" viewBox="0 0 1440 160" role="img" aria-labelledby="title desc">
  <title id="title">Kim Minseok terminal profile footer</title>
  <desc id="desc">A terminal-style GitHub profile footer ending with exit code zero.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020806"/>
      <stop offset="100%" stop-color="#071A15"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1914"/>
      <stop offset="50%" stop-color="#0B201A"/>
      <stop offset="100%" stop-color="#0A1914"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="45%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity=".16"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="terminal">
      <rect x="56" y="18" width="1328" height="124" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1440" height="160" fill="url(#bg)"/>
  <rect width="1440" height="160" fill="url(#scanlines)"/>

  <g clip-path="url(#terminal)">
    <rect x="56" y="18" width="1328" height="124" rx="12" fill="#010403"/>
    <rect x="56" y="18" width="1328" height="34" fill="url(#bar)"/>

    <circle cx="78" cy="35" r="5" fill="#EF4444"/>
    <circle cx="96" cy="35" r="5" fill="#F59E0B"/>
    <circle cx="114" cy="35" r="5" fill="#22C55E"/>

    <text x="720" y="40"
          text-anchor="middle"
          fill="#5EEAD4"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="11">
      minseok@enterprise: ~/profile
    </text>

    <text x="88" y="82"
          fill="#4ADE80"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="13"
          font-weight="700">$ exit</text>

    <text x="88" y="110"
          fill="#E5FFF4"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="14"
          font-weight="650">
      Architecture matters. Domain context matters. Evidence matters.
    </text>

    <text x="88" y="132"
          fill="#86EFAC"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="11">
      Process completed successfully · exit_code=0 · connection closed
    </text>

    <rect x="812" y="126" width="500" height="2" rx="1" fill="url(#accent)" filter="url(#softGlow)"/>
  </g>

  <rect x="56" y="18" width="1328" height="124" rx="12"
        fill="none" stroke="#34D399" stroke-opacity=".34" stroke-width="1"/>
</svg>
